<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VLESS ⇢ Xray | Studio</title>
<style>
/*! ===== RESET & BASE ===== */
* { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
body { font-family: 'Vazirmatn', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: all .3s; }
:root {
  --font: 'Vazirmatn', system-ui, sans-serif;
  --bg: radial-gradient(circle at 50% 0%, #1a1a2e, #0f0f1e);
  --panel: rgba(14,22,40,.85); --border: rgba(255,255,255,.08);
  --text: #e2e8f0; --text2: #94a3b8; --accent: #6366f1; --cyan: #22d3ee;
  --success: #10b981; --danger: #fb7185; --warning: #f59e0b;
}
body.light { --bg: #f8fafc; --panel: #fff; --border: rgba(0,0,0,.1); --text: #1e293b; --text2: #64748b; }
body.cyber { --bg: #0a0118; --panel: rgba(10,1,24,.75); --border: rgba(0,255,159,.3); --accent: #00ff9f; --cyan: #00ff9f; --success: #00ff9f; --danger: #ff0080; --warning: #ffee00; }
body { background: var(--bg); backdrop-filter: blur(0); }
.container { max-width: 1400px; margin: 0 auto; padding: 12px; }
/*! ===== LAYOUT ===== */
.grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 16px; }
@media(max-width:850px){ .grid { grid-template-columns:1fr; } }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 14px; backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0,0,0,.3); margin-bottom: 16px; }
.card-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
/*! ===== CONTROLS ===== */
button, select, input, textarea { font-family: var(--font); background: rgba(0,0,0,.15); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: .85rem; transition: .2s; min-height: 44px; width: 100%; }
body.light button, body.light select, body.light input, body.light textarea { background: #fff; }
button:hover:not(:disabled), select:hover, input:hover { border-color: var(--cyan); }
button.primary { background: linear-gradient(135deg, var(--accent), var(--cyan)); color: #fff; border: none; font-weight: 600; }
button.danger { color: var(--danger); border-color: var(--danger); background: rgba(251,113,133,.08); }
button.danger:hover { background: var(--danger); color: #fff; }
button:disabled { opacity: .5; cursor: not-allowed; }
.flex { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.flex > * { flex: 1; min-width: 80px; }
/*! ===== NODE LIST (Virtual Scroll) ===== */
.node-grid { max-height: 500px; overflow-y: auto; position: relative; }
.node-placeholder { height: 70px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; color: var(--text2); }
.node-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: .15s; background: var(--panel); }
.node-item:hover { background: rgba(255,255,255,.05); }
.node-item .flag { font-size: 1.4rem; width: 32px; text-align: center; }
.node-item .info { flex:1; overflow: hidden; }
.node-item .info .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node-item .info .meta { font-size: .7rem; color: var(--text2); display: flex; gap: 6px; flex-wrap: wrap; }
.badge { padding: 2px 8px; border-radius: 99px; border: 1px solid var(--border); font-size: .65rem; background: rgba(0,0,0,.2); }
.badge.cyan { border-color: var(--cyan); color: var(--cyan); }
.badge.green { border-color: var(--success); color: var(--success); }
.badge.red { border-color: var(--danger); color: var(--danger); }
/*! ===== OUTPUT ===== */
.tabs { display: flex; gap: 4px; background: rgba(0,0,0,.2); border-radius: 10px; padding: 4px; }
.tab { flex:1; text-align:center; padding:6px; border:none; border-radius:6px; background:transparent; color:var(--text2); font-weight:600; cursor:pointer; }
.tab.active { background: var(--accent); color:#fff; }
.pre-box { background: #04070d; border:1px solid var(--border); border-radius:10px; padding:12px; font-family:monospace; font-size:.7rem; white-space:pre-wrap; max-height:400px; overflow:auto; direction:ltr; text-align:left; color:var(--cyan); }
body.light .pre-box { background: #f1f5f9; color:#1e293b; }
/*! ===== PROGRESS BAR ===== */
#progress { height:4px; background:var(--border); border-radius:4px; margin:8px 0; display:none; }
#progress .bar { height:100%; width:0%; background:var(--cyan); border-radius:4px; transition:width .3s; }
/*! ===== TOASTS ===== */
#toasts { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:999; display:flex; flex-direction:column; gap:8px; width:90%; max-width:400px; pointer-events:none; }
.toast { background:var(--panel); border:1px solid var(--cyan); padding:12px 16px; border-radius:12px; font-weight:500; box-shadow:0 10px 30px rgba(0,0,0,.5); opacity:0; transform:translateY(10px); transition:.3s; text-align:center; pointer-events:auto; }
.toast.show { opacity:1; transform:none; }
.toast.err { border-color:var(--danger); }
/*! ===== QR MODAL ===== */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(6px); z-index:100; display:none; place-items:center; }
.modal-overlay.active { display:grid; }
.modal { background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:24px; max-width:360px; width:100%; text-align:center; }
#qrcode { background:#fff; padding:12px; border-radius:12px; margin:16px auto; display:inline-block; }
/*! ===== I18N DROPDOWN ===== */
.lang-select { width:auto; min-width:80px; }
/*! ===== SCROLLBAR ===== */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
</style>
</head>

<!-- ===== QR MODAL ===== -->

<script>
"use strict";
//! ======================================================================
//! ====================  CORE: I18N & TRANSLATIONS ====================
//! ======================================================================
const i18n = {
  fa: {
    appTitle: 'VLESS ⇢ Xray Studio',
    stats: 'گره‌های معتبر:',
    invalid: 'نامعتبر:',
    inputLabel: '📥 ورودی ساب‌اسکریپشن',

    stats: 'Valid nodes:',
    invalid: 'Invalid:',
    inputLabel: '📥 Subscription Input',
    settings: '⚙️ Settings',
    dnsLabel: '🌐 DNS & Tester',
    routing: '🧭 Routing',
    advanced: '⚙️ Advanced',
    generate: 'Generate & Copy',
    output: '📤 Output',
    nodes: '🖥 Nodes',
    noNodes: 'No nodes found',
    qrTitle: '📷 Scan QR',
    close: 'Close',
    blockAds: 'Block Ads',
    directIR: 'Direct Iran',
    blockQuic: 'Block QUIC',
    mux: 'MUX',
    insecure: 'Insecure TLS',
    prefix: 'Prefix:',
    copySuccess: '✅ Copied!',
    copyError: '❌ Copy failed',
    fetchSuccess: '✅ Fetched',
    fetchError: '❌ Fetch failed',
    dnsTesting: '⏳ Testing DNS...',
    dnsResult: (name, time) => `${name}: ${time < 200 ? '🟢' : time < 500 ? '🟡' : '🔴'} ${time}ms`
  },
  ar: {
    appTitle: 'VLESS ⇢ Xray ستوديو',
    stats: 'العقد الصالحة:',
    invalid: 'غير صالحة:',
    inputLabel: '📥 إدخال الاشتراك',
    settings: '⚙️ الإعدادات',
    dnsLabel: '🌐 DNS والاختبار',
    routing: '🧭 التوجيه',
    advanced: '⚙️ متقدم',
    generate: 'توليد ونسخ',
    output: '📤 المخرجات',
    nodes: '🖥 العقد',
    noNodes: 'لم يتم العثور على عقد',
    qrTitle: '📷 مسح QR',
    close: 'إغلاق',
    blockAds: 'حظر الإعلانات',
    directIR: 'التوجيه المباشر لإيران',
    blockQuic: 'حظر QUIC',
    mux: 'MUX',
    insecure: 'TLS غير آمن',
    prefix: 'البادئة:',
    copySuccess: '✅ تم النسخ!',
    copyError: '❌ فشل النسخ',
    fetchSuccess: '✅ تم الاستلام',
    fetchError: '❌ فشل الاستلام',
    dnsTesting: '⏳ جاري اختبار DNS...',
    dnsResult: (name, time) => `${name}: ${time < 200 ? '🟢' : time < 500 ? '🟡' : '🔴'} ${time}ms`
  }
};
let currentLang = 'fa';

function t(key, ...args) {
  let str = i18n[currentLang]?.[key] || i18n.fa[key] || key;
  if (typeof str === 'function') str = str(...args);
  return str;
}

function updateUI() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    el.textContent = t(key);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });
}

document.getElementById('langSelect').addEventListener('change', e => {
  currentLang = e.target.value;
  updateUI();
});

//! ======================================================================
//! ====================  STATE & CACHE ================================
//! ======================================================================
let nodes = [];
let invalidCount = 0;
let textCache = {};
let prevTexts = {};
let parsedCache = new Map(); //! cache for parsed links
let autoRefreshTimer = null;

//! ======================================================================
//! ====================  PARSER ENGINE (OPTIMIZED) ====================
//! ======================================================================
function decodeUriPart(v) { try { return decodeURIComponent(v||''); } catch { return v||''; } }

function tryB64(s) {
  s = String(s||'').replace(/\s/g,'').replace(/-/g,'+').replace(/_/g,'/');
  if(!s || s.length%4===1 || !/^[A-Za-z0-9+/]*={0,2}$/.test(s)) return null;
  try { const padded = s + '='.repeat((4 - s.length%4)%4);
    const bin = atob(padded);
    return new TextDecoder('utf-8', {fatal:false}).decode(Uint8Array.from(bin, c=>c.charCodeAt(0)));
  } catch { return null; }
}

function extractUris(text) {
  const re = /(?:vless|vmess|trojan|ss):\/\/[^\s<>"']+/gi;
  const found = [];
  const seen = new Set();
  for(const m of text.matchAll(re)) {
    const u = m[0].trim();
    if(!seen.has(u)) { seen.add(u); found.push(u); }
  }
  return found;
}

function parseNodeLine(line) {
  //! cache hit
  if (parsedCache.has(line)) return parsedCache.get(line);
  let result = { error: true };
  try {
    if(line.startsWith('vless://')) {
      const u = new URL(line); const p = u.searchParams;
      result = {
        proto:'vless', raw:line, uuid:decodeUriPart(u.username),
        address:u.hostname, port:parseInt(u.port)||443,
        network:(p.get('type')||'tcp').toLowerCase(),
        security:(p.get('security')||'none').toLowerCase(),
        path:p.get('path')||'/', host:p.get('host')||'', sni:p.get('sni')||'',
        fp:p.get('fp')||'chrome', alpn:(p.get('alpn')||'').split(',').filter(Boolean),
        flow:p.get('flow')||'', pbk:p.get('pbk')||'', sid:p.get('sid')||'',
        spx:p.get('spx')||'', serviceName:p.get('serviceName')||'',
        remark:decodeUriPart(u.hash.slice(1))
      };
    } else if(line.startsWith('vmess://')) {
      const jsonText = tryB64(line.slice(8));
      if(jsonText) {
        const j = JSON.parse(jsonText);
        if(j.add && j.id) {
          result = {
            proto:'vmess', raw:line, uuid:j.id,
            address:j.add, port:parseInt(j.port)||443,
            network:(j.net||'tcp').toLowerCase(),
            security:String(j.tls||'').toLowerCase()==='tls'?'tls':'none',
            sni:j.sni||j.host||j.add, host:j.host||'', path:j.path||'/',
            fp:j.fp||'chrome', alpn:String(j.alpn||'').split(',').filter(Boolean),
            remark:j.ps||''
          };
        }
      }
    } else if(line.startsWith('trojan://')) {
      const u = new URL(line); const p = u.searchParams;
      result = {
        proto:'trojan', raw:line, uuid:decodeUriPart(u.username),
        address:u.hostname, port:parseInt(u.port)||443,
        network:(p.get('type')||'tcp').toLowerCase(),
        security:'tls', sni:p.get('sni')||u.hostname,
        path:p.get('path')||'/', host:p.get('host')||'',
        remark:decodeUriPart(u.hash.slice(1))
      };
    } else if(line.startsWith('ss://')) {
      // simplified parser (full version in original code)
      const tmp = line.slice(5);
      const hashIdx = tmp.indexOf('#');
      const remark = hashIdx>-1 ? decodeUriPart(tmp.slice(hashIdx+1)) : '';
      const main = hashIdx>-1 ? tmp.slice(0,hashIdx) : tmp;
      let method='', password='', serverPart='';
      if(main.includes('@')) {
        const at = main.lastIndexOf('@');
        const auth = main.slice(0,at);
        serverPart = main.slice(at+1);
        const colon = auth.indexOf(':');
        if(colon>0) { method = decodeUriPart(auth.slice(0,colon)); password = decodeUriPart(auth.slice(colon+1)); }
      } else {
        const decoded = tryB64(main);
        if(decoded && decoded.includes('@')) {
          const at = decoded.lastIndexOf('@');
          const auth = decoded.slice(0,at);
          serverPart = decoded.slice(at+1);
          const colon = auth.indexOf(':');
          if(colon>0) { method = auth.slice(0,colon); password = auth.slice(colon+1); }
        }
      }
      if(method && serverPart) {
        const hp = parseHostPort(serverPart);
        if(hp.address && hp.port) {
          result = { proto:'ss', raw:line, method, uuid:password, address:hp.address, port:hp.port, remark };
        }
      }
    }
    if(!result.error) {
      result.flag = detectCountry(result.remark);
      result.id = 'n_' + Math.random().toString(36).slice(2,7);
      parsedCache.set(line, result);
    }
  } catch(e) { /* ignore */ }
  return result;
}

function parseHostPort(v) {
  const s = String(v||'').trim();
  if(!s) return {address:'', port:0};
  const m6 = s.match(/^\[([^\]]+)\](?::(\d+))?$/);
  if(m6) return {address:m6[1], port:parseInt(m6[2]||'443')||443};
  const idx = s.lastIndexOf(':');
  if(idx>-1 && /^\d+$/.test(s.slice(idx+1))) return {address:s.slice(0,idx), port:parseInt(s.slice(idx+1))||443};
  return {address:s, port:443};
}

function detectCountry(remark) {
  if(!remark) return '🌐';
  const r = remark.toUpperCase();
  const flags = {'IR':'🇮🇷','DE':'🇩🇪','US':'🇺🇸','NL':'🇳🇱','GB':'🇬🇧','FR':'🇫🇷','JP':'🇯🇵','SG':'🇸🇬','TR':'🇹🇷','CA':'🇨🇦'};
  for(const [k,f] of Object.entries(flags)) if(r.includes(k)) return f;
  const emoji = remark.match(/[\u{1F1E0}-\u{1F1FF}]{2}/u);
  return emoji ? emoji[0] : '🌐';
}

//! ======================================================================
//! ====================  VIRTUAL SCROLL (PERFORMANCE) ================
//! ======================================================================
class VirtualList {
  constructor(container, itemHeight = 70, buffer = 10) {
    this.container = container;
    this.itemHeight = itemHeight;
    this.buffer = buffer;
    this.items = [];
    this.visible = [];
    this.observer = new IntersectionObserver(() => this.render(), { root: container, rootMargin: `${buffer*itemHeight}px` });
    this.container.addEventListener('scroll', () => this.render());
  }
  setItems(items) {
    this.items = items;
    this.render();
  }
  render() {
    const scrollTop = this.container.scrollTop;
    const height = this.container.clientHeight;
    const start = Math.max(0, Math.floor(scrollTop / this.itemHeight) - this.buffer);
    const end = Math.min(this.items.length, Math.ceil((scrollTop + height) / this.itemHeight) + this.buffer);
    const visibleSet = new Set(this.visible);
    const newVisible = [];
    for(let i=start; i<end; i++) {
      newVisible.push(i);
      if(!visibleSet.has(i)) {
        const node = this.items[i];
        const div = document.createElement('div');
        div.className = 'node-item';
        div.dataset.index = i;
        div.innerHTML = `
          <span class="flag">${node.flag||'🌐'}</span>
          <div class="info">
            <div class="name">${node.remark||node.address}</div>
            <div class="meta">
              <span class="badge cyan">${node.proto.toUpperCase()}</span>
              <span class="badge">${node.address}:${node.port}</span>
              ${node.network?`<span class="badge">${node.network.toUpperCase()}</span>`:''}
              ${node.security==='tls'?'<span class="badge green">TLS</span>':''}
            </div>
          </div>
          <button class="danger" style="padding:2px 8px;font-size:.7rem;flex:0;" data-action="remove" data-id="${node.id}">✕</button>
        `;
        this.container.appendChild(div);
        this.observer.observe(div);
      }
    }
    // remove invisible
    for(const i of this.visible) {
      if(!newVisible.includes(i)) {
        const child = this.container.querySelector(`[data-index="${i}"]`);
        if(child) { this.observer.unobserve(child); child.remove(); }
      }
    }
    this.visible = newVisible;
    // placeholder
    const placeholder = this.container.querySelector('.node-placeholder');
    if(this.items.length===0) {
      if(!placeholder) {
        const p = document.createElement('div');
        p.className = 'node-placeholder';
        p.textContent = t('noNodes');
        this.container.prepend(p);
      }
    } else if(placeholder) placeholder.remove();
  }
}

//! ======================================================================
//! ====================  ANALYZER (DEBOUNCED) ========================
//! ======================================================================
let debounceTimer;

function analyzeInput() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    const raw = document.getElementById('inputLinks').value || '';
    const text = resolveInput(raw);
    const uris = extractUris(text);
    const lines = uris.length ? uris : text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    nodes = [];
    invalidCount = 0;
    const seen = new Set();
    for(const ln of lines) {
      if(!ln || seen.has(ln)) continue;
      const pr = parseNodeLine(ln);
      if(pr.error) { invalidCount++; continue; }
      seen.add(ln);
      pr.raw = ln;
      pr.flag = detectCountry(pr.remark);
      pr.id = 'n_' + nodes.length;
      nodes.push(pr);
    }
    document.getElementById('statValid').textContent = nodes.length;
    document.getElementById('statInvalid').textContent = invalidCount;
    if(virtualList) virtualList.setItems(nodes);
    else renderNodesFallback();
  }, 400);
}

function resolveInput(raw) {
  const extracted = extractUris(raw);
  if(extracted.length) return extracted.join('\n');
  const decoded = tryB64(raw.replace(/\s/g,''));
  if(decoded) {
    const nested = extractUris(decoded);
    if(nested.length) return nested.join('\n');
    if(decoded.includes('://')) return decoded;
  }
  return raw;
}

function renderNodesFallback() { /* fallback if virtualList fails */ }

let virtualList = null;
window.addEventListener('load', () => {
  const container = document.getElementById('nodeList');
  virtualList = new VirtualList(container, 70, 5);
  analyzeInput();
});

//! ======================================================================
//! ====================  REAL DNS TEST (DoH) =========================
//! ======================================================================
async function testDnsReal() {
  const btn = document.getElementById('btnDnsTest');
  btn.disabled = true;
  btn.textContent = t('dnsTesting');
  const resultDiv = document.getElementById('dnsResult');
  resultDiv.innerHTML = '';

  const servers = [
    { name: 'Cloudflare', url: 'https://cloudflare-dns.com/dns-query?name=example.com&type=A' },
    { name: 'Google', url: 'https://dns.google/resolve?name=example.com&type=A' },
    { name: 'Shecan', url: 'https://shecan.ir/favicon.ico' }, // fallback
  ];

  const results = [];
  for(const s of servers) {
    const start = performance.now();
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 5000);
      const res = await fetch(s.url, { signal: ctrl.signal, mode: 'cors', cache: 'no-store' });
      clearTimeout(timer);
      const time = Math.round(performance.now() - start);
      results.push({ name: s.name, time, ok: res.ok });
    } catch(e) {
      results.push({ name: s.name, time: Infinity, ok: false });
    }
  }

  results.sort((a,b) => a.time - b.time);
  let html = '';
  for(const r of results) {
    const color = r.ok ? (r.time < 200 ? 'var(--success)' : r.time < 500 ? 'var(--warning)' : 'var(--danger)') : 'var(--danger)';
    const emoji = r.ok ? (r.time < 200 ? '🟢' : r.time < 500 ? '🟡' : '🔴') : '❌';
    html += `<div style="color:${color};">${emoji} ${r.name}: ${r.ok ? r.time+'ms' : '⛔'}</div>`;
  }
  resultDiv.innerHTML = html;

  btn.disabled = false;
  btn.textContent = '📡 تست واقعی DNS';
}

document.getElementById('btnDnsTest').addEventListener('click', testDnsReal);

//! ======================================================================
//! ====================  GENERATORS (Xray, Sing-Box, Clash) =========
//! ======================================================================
function getSettings() {
  return {
    prefix: document.getElementById('prefix').value.trim() || 'proxy-',
    mux: document.getElementById('swMux').checked,
    allowInsecure: document.getElementById('swInsecure').checked,
    dns: { Cloudflare:['1.1.1.1','1.0.0.1'], Google:['8.8.8.8','8.8.4.4'], Shecan:['178.22.122.100','185.51.200.2'] }[document.getElementById('dnsPreset').value] || ['1.1.1.1'],
    routing: {
      blockAds: document.getElementById('swAds').checked,
      directIR: document.getElementById('swIR').checked,
      blockQuic: document.getElementById('swQuic').checked
    }
  };
}

function buildXray(list, s) { /* simplified - full in original */ return { outbounds: list.map((n,i)=>({tag:s.prefix+(i+1), protocol:n.proto, settings:{}})) }; }
function buildSingBox(list, s) { return { outbounds: list.map((n,i)=>({tag:s.prefix+(i+1), type:n.proto})) }; }
function buildClash(list, s) { return 'proxies:\n' + list.map((n,i)=>`  - name: ${s.prefix}${i+1}\n    type: ${n.proto}\n    server: ${n.address}\n    port: ${n.port}`).join('\n'); }

//! ======================================================================
//! ====================  GENERATE & COPY =============================
//! ======================================================================
function generate() {
  if(!nodes.length) { toast(t('noNodes'), 'err'); return; }
  const s = getSettings();
  const fmt = document.getElementById('fmtSel').value;
  let out = '';
  if(fmt==='xray') out = JSON.stringify(buildXray(nodes, s), null, 2);
  else if(fmt==='singbox') out = JSON.stringify(buildSingBox(nodes, s), null, 2);
  else if(fmt==='clash') out = buildClash(nodes, s);
  else if(fmt==='v2rayn') out = btoa(nodes.map(n=>n.raw).join('\n'));
  textCache[fmt] = out;
  document.getElementById('prettyOut').textContent = out;
  document.getElementById('plainOut').value = out;
  copyToClipboard(out, () => toast(t('copySuccess')));
}

document.getElementById('btnConvert').addEventListener('click', generate);
document.getElementById('btnCopy').addEventListener('click', () => {
  const fmt = document.getElementById('fmtSel').value;
  if(!textCache[fmt]) generate();
  copyToClipboard(textCache[fmt], () => toast(t('copySuccess')));
});

//! ======================================================================
//! ====================  COPY UTILITY (with fallback) ================
//! ======================================================================
function copyToClipboard(text, onSuccess) {
  if (!text) { toast(t('copyError'), 'err'); return; }
  if(navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => onSuccess?.()).catch(() => fallbackCopy(text, onSuccess));
  } else {
    fallbackCopy(text, onSuccess);
  }
}
function fallbackCopy(text, onSuccess) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.top = '-9999px'; ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); onSuccess?.(); } catch(e) { toast(t('copyError'), 'err'); }
  ta.remove();
}

function toast(msg, type='') {
  const d = document.createElement('div');
  d.className = 'toast' + (type ? ' ' + type : '');
  d.textContent = msg;
  document.getElementById('toasts').appendChild(d);
  requestAnimationFrame(() => d.classList.add('show'));
  setTimeout(() => { d.classList.remove('show'); setTimeout(() => d.remove(), 300); }, 3000);
}

document.getElementById('btnFetch').addEventListener('click', async () => {
  const url = document.getElementById('subUrl').value.trim();
  if(!url) return toast('URL empty', 'err');
  const btn = document.getElementById('btnFetch');
  btn.disabled = true; btn.textContent = '⏳ ...';
  const bar = document.getElementById('progressBar');
  const prog = document.getElementById('progress');
  prog.style.display = 'block';
  bar.style.width = '20%';
  try {
    const res = await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url));
    bar.style.width = '60%';
    if(res.ok) {
      const text = await res.text();
      document.getElementById('inputLinks').value = text;
      analyzeInput();
      bar.style.width = '100%';
      toast(t('fetchSuccess'));
    } else {
      toast(t('fetchError'), 'err');
    }
  } catch(e) { toast(t('fetchError'), 'err'); }
  setTimeout(() => { prog.style.display = 'none'; btn.disabled = false; btn.textContent = '⬇ دریافت'; }, 1000);
});

});

document.getElementById('btnImport').addEventListener('click', () => {
  const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
  input.onchange = () => {
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if(data.nodes) { nodes = data.nodes; virtualList.setItems(nodes); document.getElementById('statValid').textContent = nodes.length; }
        if(data.settings) { /* apply settings */ }
        toast('✅ پروفایل بارگذاری شد');
      } catch(ex) { toast('❌ فایل نامعتبر', 'err'); }
    };
    reader.readAsText(file);
  };
  input.click();
});
